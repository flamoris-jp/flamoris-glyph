name: Python cross-platform
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[patterns]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Generate portable demo
        run: python -m flamoris_glyph.cli generate examples/demo.srt --song "Red Shoes experiment" --skeletons examples/skeletons.json --style examples/tango.style.json --seed 42 --out output-demo
      - name: Validate portable demo
        run: python -m flamoris_glyph.cli validate output-demo
      - name: Preview portable demo
        run: python -m flamoris_glyph.cli preview output-demo --out output-demo/preview.svg
      - name: Generate original Pattern DNA review matrix
        run: python -m flamoris_glyph.pattern_lab examples/pattern-structure.srt --skeletons examples/pattern-lab-skeletons.json --out output-pattern-lab
      - uses: actions/upload-artifact@v4
        with:
          name: glyph-demo-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            output-demo/
            output-pattern-lab/


