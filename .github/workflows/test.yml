name: Python cross-platform
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[patterns]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Generate portable demo
        run: python -m flamoris_glyph.cli generate examples/demo.srt --song "Red Shoes experiment" --skeletons examples/skeletons.json --style examples/tango.style.json --seed 42 --out output-demo
      - name: Validate portable demo
        run: python -m flamoris_glyph.cli validate output-demo
      - name: Preview portable demo
        run: python -m flamoris_glyph.cli preview output-demo --out output-demo/preview.svg
      - name: Generate original Pattern DNA review matrix
        run: python -m flamoris_glyph.pattern_lab examples/pattern-structure.srt --skeletons examples/pattern-lab-skeletons.json --out output-pattern-lab
      - name: Generate paired authored structure study
        run: python -m flamoris_glyph.structure_lab examples/aka-structure.json --out output-structure-study
      - name: Generate bone and ink ablation study
        run: python -m flamoris_glyph.anatomy_lab examples/aka-structure.json examples/anatomy-dna/elastic-retro.json --out output-anatomy-study
      - name: Generate fixed-ink skeleton pattern study
        run: python -m flamoris_glyph.skeleton_lab examples/aka-structure.json examples/anatomy-dna/elastic-retro.json examples/skeleton-patterns.json --out output-skeleton-study
      - name: Generate skeleton DNA and calligraphy study
        run: python -m flamoris_glyph.calligraphy_lab examples/aka-structure.json examples/calligraphy-study.json --out output-calligraphy-study
      - name: Generate single-stroke action study
        run: python -m flamoris_glyph.stroke_lab examples/stroke-program-study.json --out output-stroke-study
      - name: Generate bilingual lyric artwork
        run: python -m flamoris_glyph.lyric_performance examples/mou-iiyo --out output-lyric-performance
      - name: Generate exaggerated lyric artwork
        run: python -m flamoris_glyph.lyric_performance examples/mou-iiyo --intensity 4 --out output-lyric-exaggerated
      - uses: actions/upload-artifact@v4
        with:
          name: glyph-demo-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            output-demo/
            output-pattern-lab/
            output-structure-study/
            output-anatomy-study/
            output-skeleton-study/
            output-calligraphy-study/
            output-stroke-study/
            output-lyric-performance/
            output-lyric-exaggerated/


